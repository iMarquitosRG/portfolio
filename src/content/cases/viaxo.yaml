sections:
  - id: overview
    nav: Overview
    label: 01 · Overview
    title: One app to run a travel agency.
    lead: "Viaxo is a management app for a travel agency: clients, itineraries, reservations and payments in one place. I led the UX/UI end to end, from interviews with the team to an app that works on web, mobile and tablet."
    blocks:
      - type: facts
        items:
          - { value: "0 → 1", label: Designed from scratch }
          - { value: "~40%", label: Less time on payments and client admin }
          - { value: "1", label: App for the whole agency workflow }
      - { type: media, label: App overview, height: md }

  - id: problem
    nav: Problem
    label: 02 · Problem
    title: "The agency ran on spreadsheets and an outdated tool."
    blocks:
      - type: statement
        label: Problem statement
        text: "Creating a simple client record took far too long, and the team couldn’t work from a phone when it mattered."
      - type: paragraphs
        items:
          - "Work was split between Excel spreadsheets and an internal tool with no mobile or tablet support. The client described it as an airplane cockpit: cluttered inputs and buttons, no flow to guide the process, and missing features the agency needed every day."

  - id: research
    nav: Research
    label: 03 · Research
    title: What the agency team needed.
    lead: "Interviews with the client and observation of how the team actually worked."
    blocks:
      - type: cards
        items:
          - { eyebrow: Insight 01, title: "Too many inputs, no guidance", text: "One overloaded form per task made every record slow to create." }
          - { eyebrow: Insight 02, title: "Urgent moments happen away from the desk", text: "Agents needed to answer clients from a phone, and the old tool only worked on desktop." }
          - { eyebrow: Insight 03, title: "Restructure, don’t add", text: "The agency didn’t need more features. It needed a process people could follow." }

  - id: decisions
    nav: Key decisions
    label: 04 · Key decisions
    title: Three decisions that defined the product.
    lead: "Each one: the problem, the options considered, and why this direction won."
    blocks:
      - type: decisions
        items:
          - eyebrow: Decision 01
            title: "Guided, multi-step flows"
            text: "I replaced single overloaded forms with guided, multi-step flows for itineraries and reservations, so agents always know the next step."
            after: { label: Decision screen }
          - eyebrow: Decision 02
            title: "Client records that are quick to update"
            text: "I redesigned client management so records are easy to create and update, and rethought how the team organizes and splits its daily work."
            after: { label: Decision screen }
          - eyebrow: Decision 03
            title: "Built to work from anywhere"
            text: "I designed the whole app for web, mobile and tablet, so agents can handle urgent requests on the go, the biggest gap of the old tool."
            after: { label: Decision screen }

  - id: core-flows
    nav: Core flows
    label: 05 · Core flows
    title: Designing the core flows.
    lead: "Client records, itineraries and reservations, and payments, connected in one app."
    blocks:
      - type: cards
        items:
          - { eyebrow: Flow 01, title: "Client records", text: "Create and update a client in a few steps." }
          - { eyebrow: Flow 02, title: "Itineraries and reservations", text: "A guided flow instead of one long form." }
          - { eyebrow: Flow 03, title: "Payments and deposits", text: "Payments and deposits managed in one place." }
      - { type: media, label: Core flows, height: md }
      - { type: link, label: View all work, href: "/#work" }

  - id: testing
    nav: Validation
    label: 06 · Validation
    title: Checked with the agency team.
    lead: "The agency team moved to the new app and used it from day one."
    blocks:
      - type: rounds
        items:
          - { label: No adoption issues, text: "The client had no issues adapting to the new system." }
          - { label: About 40% faster, text: "Payments, deposits and client admin became about 40% faster than before." }
          - { label: Confident from day one, text: "A guided process replaced what used to feel overwhelming." }

  - id: outcome
    nav: Outcome
    label: 07 · Outcome
    title: What shipped and what changed.
    lead: "Payments, deposits and client admin became about 40% faster, on web, mobile and tablet."
    blocks:
      - { type: media, label: "Final screens · web, tablet, mobile", height: lg }

  - id: learnings
    nav: Learnings
    label: 08 · Learnings
    title: What I took from it.
    blocks:
      - type: list
        items:
          - "Good design isn’t about adding capability. It’s about removing the friction that keeps people from using what’s already there."
