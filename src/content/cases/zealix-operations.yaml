sections:
  - id: overview
    nav: Overview
    label: 01 · Overview
    title: One platform, two layers, built from zero.
    lead: "Zealix is a restaurant platform built from zero in two layers. The Operations Layer is the POS that waiters, cashiers and kitchen staff use during service. I led its product design end to end: research with staff, the design system, every flow across web, mobile and tablet, and QA with engineering."
    blocks:
      - type: facts
        items:
          - { value: "2", label: Products in the Zealix platform }
          - { value: "3", label: "Platforms: web, mobile, tablet" }
          - { value: "0 → 1", label: From first research to QA }
      - { type: media, label: "Ecosystem diagram · Operations + Admin", height: md }

  - id: problem
    nav: Problem
    label: 02 · Problem
    title: Restaurant staff work under pressure.
    blocks:
      - type: statement
        label: Problem statement
        text: "Staff lost track of orders at peak hours, because their tools didn’t match how they actually work under pressure."
      - type: paragraphs
        items:
          - "Restaurants were losing time and money to food waste from poor inventory control and to workflows that weren’t built for busy, multi-step service. Teams on paper lost orders on the way to the kitchen, and teams on tools like Parrot hit the same walls. The problem wasn’t the lack of software. It was software built around a feature list instead of the floor."

  - id: research
    nav: Research
    label: 03 · Research
    title: What we learned from the floor.
    lead: "Interviews and shadowing with two groups: staff working entirely on paper, and staff already using tools like Parrot. Both groups pointed to the same issues."
    blocks:
      - type: cards
        items:
          - { eyebrow: Insight 01, title: "Peak hours break the flow", text: "When demand spiked, orders reached the kitchen wrong, especially for teams on paper." }
          - { eyebrow: Insight 02, title: "Inventory lived apart from orders", text: "Stock was updated by hand as a separate task, so it fell behind and food went to waste." }
          - { eyebrow: Insight 03, title: "Two very different users", text: "The same screen had to work for first-time users and for people used to other POS tools." }

  - id: decisions
    nav: Key decisions
    label: 04 · Key decisions
    title: Three decisions that defined the product.
    lead: "Each one: the problem, the options considered, and why this direction won."
    blocks:
      - type: decisions
        items:
          - eyebrow: Decision 01
            title: "Inventory linked to every dish"
            text: "Stock was a manual task that always fell behind. I linked inventory to each dish, so every order updates stock automatically inside the ordering flow, with no extra step for staff."
            after: { label: Decision screen }
          - eyebrow: Decision 02
            title: "A fast mode for peak hours"
            text: "Complete flows slowed staff down when the restaurant was full. I designed a dedicated fast mode that favors speed over completeness at peak hours, while the full flow stays one tap away."
            after: { label: Decision screen }
          - eyebrow: Decision 03
            title: "AI trend prediction to plan ahead"
            text: "Owners planned stock and menus by gut feeling. I proposed and designed the UX for a trend prediction feature that uses historical sales to show which dishes are likely to sell. Engineering built it."
            after: { label: Decision screen }

  - id: design-system
    nav: Design system
    label: 05 · Design system
    title: A shared language for both layers.
    lead: One Figma design system for Operations and Admin, with themes for each product in light and dark.
    blocks:
      - type: facts
        items:
          - { value: "4", label: "Theme modes: POS and Capa Cero, light and dark" }
          - { value: "2", label: Products running on one system }
          - { value: "3", label: Platforms from the same components }
      - { type: media, label: "Tokens, modes and components", height: md }
      - { type: link, label: See how it scales in the Admin Layer, href: /work/zealix-admin }

  - id: testing
    nav: Validation
    label: 06 · Validation
    title: Tested with real staff, not assumptions.
    lead: "Validated with staff from both groups, including people who had never used restaurant software before."
    blocks:
      - type: rounds
        items:
          - { label: No formal training, text: "Staff adapted to the system without formal training, including first-time users." }
          - { label: Faster at peak hours, text: "Fast mode was called out for making order taking noticeably quicker when the restaurant was full." }
          - { label: "Less waste, better plans", text: "Dish-linked inventory helped reduce waste, and trend prediction gave owners a clearer picture to plan ahead." }

  - id: outcome
    nav: Outcome
    label: 07 · Outcome
    title: What shipped and what changed.
    lead: "The Operations Layer shipped on web, mobile and tablet: dish-linked inventory, fast mode, AI trend prediction, and a reporting module where owners see all sales and generate reports by custom or monthly periods."
    blocks:
      - { type: media, label: "Final screens · web, tablet, mobile", height: lg }

  - id: learnings
    nav: Learnings
    label: 08 · Learnings
    title: What I took from it.
    blocks:
      - type: list
        items:
          - "Intuitive design isn’t about simplifying features. It’s about matching the interface to how people think under pressure."
          - "Designing for tech-native and tech-hesitant staff at the same time showed me one interface can serve both when it follows the real workflow."
