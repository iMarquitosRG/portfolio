sections:
  - id: overview
    nav: Overview
    label: 01 · Overview
    title: The layer where owners run the business.
    lead: "The Admin Layer is where restaurant owners and managers run the business across branches: menus, products, promotions and sales. I led its product design, shifting the platform from single-location logic to multi-location management, and reused the Operations design system so both layers feel like one product."
    blocks:
      - type: facts
        items:
          - { value: "2", label: Products in the Zealix platform }
          - { value: "3", label: "Platforms: web, mobile, tablet" }
          - { value: "0 → 1", label: From first research to QA }
      - { type: media, label: "Ecosystem diagram · Operations + Admin", height: md }

  - id: problem
    nav: Problem
    label: 02 · Problem
    title: "Every change had to be repeated, branch by branch."
    blocks:
      - type: statement
        label: Problem statement
        text: "Owners with several branches had to repeat every menu, price and promotion change by hand in each location."
      - type: paragraphs
        items:
          - "The more branches an owner had, the bigger the bottleneck. They didn’t need a different version of the operations tool. They needed to act on all their branches at once, without losing control of each one."

  - id: research
    nav: Research
    label: 03 · Research
    title: What owners and managers needed.
    lead: "Interviews with owners who manage multiple branches, focused on how they actually run the business day to day."
    blocks:
      - type: cards
        items:
          - { eyebrow: Insight 01, title: "Repetition grows with every branch", text: "Each action was repeated per location, so more branches meant more manual work." }
          - { eyebrow: Insight 02, title: "Owners think in two views", text: "They need the whole business at a glance, and one branch in detail when something needs attention." }
          - { eyebrow: Insight 03, title: "Same platform, different job", text: "Owners didn’t need a new tool. They needed the operations tool adapted to managing." }

  - id: decisions
    nav: Key decisions
    label: 04 · Key decisions
    title: Three decisions that defined the product.
    lead: "Each one: the problem, the options considered, and why this direction won."
    blocks:
      - type: decisions
        items:
          - eyebrow: Decision 01
            title: "Bulk actions across branches"
            text: "Instead of repeating tasks location by location, owners apply promotions, update products and manage menus across many branches at once, while each branch keeps its own control."
            after: { label: Decision screen }
          - eyebrow: Decision 02
            title: "A consolidated view and a branch view"
            text: "I structured the information architecture around the two views owners need: everything across branches, and a drill-down into one branch when it needs individual attention."
            after: { label: Decision screen }
          - eyebrow: Decision 03
            title: "One design system, two contexts"
            text: "I reused Operations Layer components wherever possible, so both products stay consistent while the experience adapts to management."
            after: { label: Decision screen }

  - id: zea
    nav: Zea · AI assistant
    label: 05 · Zea · AI assistant
    title: "Zea: AI across the whole platform."
    lead: "Zea is the AI assistant inside Zealix, present across the whole app. It reads sales data and turns it into ideas, insights and alerts owners can act on."
    blocks:
      - type: cards
        items:
          - { eyebrow: My role, title: Ideas and UX, text: I contributed ideas and UX for how Zea shows up across the app. }
          - { eyebrow: What Zea does, title: Trends into ideas, text: Spots sales trends and suggests promotions or new dishes that help reduce waste. }
          - { eyebrow: What Zea does, title: Insights and alerts, text: Generates insights and alerts on sales and staff management. }
      - { type: media, label: Zea screens, height: md }
      - { type: link, label: Back to the Operations Layer, href: /work/zealix-operations }

  - id: testing
    nav: Validation
    label: 06 · Validation
    title: Validated with the people who use it.
    lead: "Validated with owners managing multiple branches."
    blocks:
      - type: rounds
        items:
          - { label: Time saved, text: "Owners saved time managing the business. How much depends on how many branches they run." }
          - { label: No more repetition, text: "Bulk actions removed the need to repeat the same task in every branch." }

  - id: outcome
    nav: Outcome
    label: 07 · Outcome
    title: What shipped and what changed.
    lead: "The Admin Layer shipped on web, mobile and tablet: bulk actions for menus, products and promotions, a consolidated view of every branch, and a dashboard for each branch."
    blocks:
      - { type: media, label: "Final screens · web, tablet, mobile", height: lg }

  - id: learnings
    nav: Learnings
    label: 08 · Learnings
    title: What I took from it.
    blocks:
      - type: list
        items:
          - "Scaling a product isn’t about adding more screens. It’s about rethinking which actions should happen once instead of many times."
